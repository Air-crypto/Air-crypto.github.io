<!doctype html><meta charset="utf-8"><title>Forest browser checks</title>
<style>body{margin:0;background:#eee;font:13px system-ui}header{height:42px;display:flex;align-items:center;gap:12px;padding:0 10px}iframe{display:block;border:0;width:100%;height:calc(100vh - 42px);margin:auto}button{padding:4px 9px}output{white-space:pre-wrap}</style>
<header><button id="run">Run checks</button><button id="out">Pinch out</button><button id="in">Pinch in</button><button id="mobile">Phone / desktop</button><output id="status">Ready</output></header>
<iframe id="app" src="../index.html?browser-check=zoom1"></iframe>
<script>
const app=document.getElementById('app'),status=document.getElementById('status');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,message)=>{if(!ok)throw Error(message)};
function gesture(scale){
 const w=app.contentWindow,v=w.document.getElementById('forest-viewport'),r=v.getBoundingClientRect();
 for(const type of ['gesturestart','gesturechange','gestureend']){
  const e=new w.Event(type,{bubbles:true,cancelable:true});
  Object.defineProperties(e,{scale:{value:type==='gesturechange'?scale:1},clientX:{value:r.left+r.width/2},clientY:{value:r.top+r.height/2}});
  v.dispatchEvent(e);
 }
 status.textContent='Zoom '+Math.round(w.forestScene.zoom*100)+'%';
}
document.getElementById('out').onclick=()=>gesture(.7);
document.getElementById('in').onclick=()=>gesture(1.3);
document.getElementById('mobile').onclick=()=>{app.style.width=app.style.width?'':'320px'};
document.getElementById('run').onclick=async()=>{
 try{
  status.textContent='Running…';
  const w=app.contentWindow,d=w.document,s=w.forestScene,v=d.getElementById('forest-viewport');
  const click=route=>d.querySelector('[data-route="'+route+'"]').click();
  const settle=async predicate=>{for(let i=0;i<100;i++){if(predicate())return;await wait(50)}throw Error('Timed out')};
  d.getElementById('back').click();await wait(900);
  click('work');await settle(()=>s.state.branches.find(b=>b.key==='work').growth===1);
  assert(!d.getElementById('return-hint').hidden,'Missing return hint');
  click('projects');await settle(()=>s.state.branches.find(b=>b.key==='work').growth===0&&s.state.branches.find(b=>b.key==='projects').growth===1);
  assert(s.state.branches.filter(b=>b.open).length===1,'More than one main branch is open');
  click('projects/ebike');await settle(()=>d.querySelector('[data-story="projects/ebike"]:not([aria-busy])'));
  click('projects/kernel');await settle(()=>d.querySelector('[data-story="projects/kernel"]:not([aria-busy])'));
  assert(d.querySelectorAll('.story-entry:not([hidden])').length===1,'Previous article stayed visible');
  assert(s.state.stories.length===1&&s.state.stories[0].key==='projects/kernel','Previous article connector stayed open');
  await wait(1500);
  const node=d.querySelector('[data-story="projects/kernel"]'),p=s.storyGeometry('projects/kernel'),before=node.getBoundingClientRect(),vp=v.getBoundingClientRect();
  const center={x:vp.width/2,y:vp.height/2},anchor={x:s.scrollOffset.left+center.x/s.zoom,y:s.scrollOffset.top+center.y/s.zoom};
  gesture(.6);await wait(100);
  const after=node.getBoundingClientRect();
  assert(Math.abs(after.width-before.width*.6)<1,'DOM content failed to scale');
  assert(Math.abs(anchor.x-s.scrollOffset.left-center.x/s.zoom)<2&&Math.abs(anchor.y-s.scrollOffset.top-center.y/s.zoom)<2,'Pinch anchor shifted');
  const q=s.storyGeometry('projects/kernel');assert(Math.hypot(p.x-q.x,p.y-q.y)<1,'Pinch regenerated content geometry');
  const origin=s.scrollOrigin,offset=s.scrollOffset;
  assert(Math.abs(after.left-vp.left-(q.x-offset.left)*s.zoom)<2,'Canvas and DOM x coordinates diverged');
  assert(Math.abs(after.top-vp.top-(q.y-offset.top)*s.zoom)<2,'Canvas and DOM y coordinates diverged');
  const old=v.scrollTop;v.scrollTop+=120;await wait(100);assert(v.scrollTop>old,'Zoomed scrolling failed');
  d.getElementById('return-hint').click();await wait(1400);
  assert(s.zoom===1&&s.state.view.type==='home'&&d.getElementById('return-hint').hidden,'Home failed to reset zoom/hint');
  assert(d.querySelectorAll('.story-entry:not([hidden])').length===0,'Home left an article visible');
  status.textContent='PASS: exclusive branches/articles, hint, zoom, anchor, alignment, scroll, reset';
 }catch(error){status.textContent='FAIL: '+error.message;console.error(error)}
};
</script>
