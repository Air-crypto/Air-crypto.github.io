<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Up Next</title>
<link rel="stylesheet" href="styles.css">

</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">Your schedule, in one place</p><h1>Up next<span class="title-dot">.</span></h1></div>
    <span class="stamp" id="stamp"></span>
  </header>

  <div id="hero"></div>

  <p class="context">America/Chicago · CST / CDT <span>Completion is saved on this device only.</span></p>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Find an assignment, interview, or event…" aria-label="Search schedule">
    <a class="btn calendar-shortcut" href="#calendar">Calendar ↗</a>
  </div>
  <details class="filters" id="filters">
    <summary>Filters <span id="filterCount">All events</span></summary>
    <div class="filter-body">
      <div class="chips" id="kinds" aria-label="Event types"></div>
      <div class="chips" id="courses" aria-label="Courses"></div>
      <div class="filter-options">
        <label class="opt"><input type="checkbox" id="showRoutine"> Attendance</label>
        <label class="opt"><input type="checkbox" id="showFree"> Free days</label>
        <label class="opt"><input type="checkbox" id="showDone"> Completed (device-local)</label>
        <button class="text-btn" id="resetFilters">Reset filters</button>
      </div>
    </div>
  </details>

  <div class="split">
    <section aria-label="Day by day"><div class="section-head"><h2>Timeline</h2><span class="muted" id="resultCount"></span></div><div id="days"></div></section>
    <aside class="side">
      <details class="panel calendar-panel" id="calendar" open>
        <summary class="calendar-toggle">Calendar <span id="calendarSummary"></span></summary>
        <div class="calendar-body">
        <div class="section-head"><h2>Calendar</h2><button class="text-btn" id="today">Today</button></div>
        <div class="cal-head">
          <button id="prev" aria-label="Previous month">‹</button>
          <strong id="month"></strong>
          <button id="next" aria-label="Next month">›</button>
        </div>
        <div class="grid" id="grid"></div>
        <div class="legend" id="legend"></div>
        <div class="selected-day" id="selectedDay"></div>
        </div>
      </details>
      <details class="panel mail-panel"><summary>Email review <span class="muted" id="mailCount"></span></summary><div id="mail"></div></details>
    </aside>
  </div>
</main>

<dialog class="drawer" id="drawer" aria-labelledby="dtitle"></dialog>

<script src="time.js"></script>
<script src="app.js"></script>
</body>
</html>
